<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Blackwood Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="particles"></canvas>

<header>
  <h1>Ryan Blackwood</h1>
  <h2 id="subtitle"></h2>

  <nav>
    <div class="tab" data-target="about">About</div>
    <div class="tab" data-target="work">Work</div>
    <div class="tab" data-target="skills">Skills</div>
    <div class="tab" data-target="projects">Projects</div>
    <div class="tab" data-target="homelab">Homelab</div>
  </nav>
</header>

<main>
  <section id="about" class="glass-card">About...</section>
  <section id="work" class="glass-card">Work...</section>
  <section id="skills" class="glass-card">Skills...</section>
  <section id="projects" class="glass-card">Projects...</section>

  <section id="homelab" class="glass-card">
    <div id="networkWrapper">
      <canvas id="networkCanvas"></canvas>
      <div id="networkNodes"></div>
    </div>

    <div id="terminal">
      <div id="terminalOutput"></div>
      <input id="terminalInput" placeholder="Enter command...">
    </div>
  </section>
</main>

<button id="terminalToggle">💻</button>
<button id="themeToggle">🌙</button>

<script src="scripts.js"></script>
</body>
</html>
