<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ryan Blackwood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">

  <!-- BACKGROUND -->
  <canvas id="particles"></canvas>
  <div class="bg-gradient"></div>

  <!-- HEADER -->
  <header class="header">
    <h1 class="title">Ryan Blackwood</h1>
    <p id="subtitle" class="subtitle"></p>

    <div class="tabs" id="tabs">
      <div class="tab" data-target="about">About</div>
      <div class="tab" data-target="education">Education</div>
      <div class="tab" data-target="work">Work</div>
      <div class="tab" data-target="skills">Skills</div>
      <div class="tab" data-target="projects">Projects</div>
      <div class="tab" data-target="homelab">Homelab</div>

      <!-- GLOW UNDERLINE -->
      <div class="tab-underline" id="tabUnderline"></div>
    </div>

    <button id="themeToggle" class="theme-btn">
      <span id="themeIcon">🌙</span>
    </button>
  </header>

  <main>
    <section id="about" class="section reveal">
      <div class="card">
        <h2>About</h2>
        <p>Content about Ryan Blackwood.</p>
      </div>
    </section>

    <section id="education" class="section reveal">
      <div class="card">
        <h2>Education</h2>
        <p>Education details here.</p>
      </div>
    </section>

    <section id="work" class="section reveal">
      <div class="card">
        <h2>Work</h2>
        <p>Work experience details here.</p>
      </div>
    </section>

    <section id="skills" class="section reveal">
      <div class="card">
        <h2>Skills</h2>
        <p>Networking, Linux, Proxmox, OPNsense, Wireguard, Python, Web Development</p>
      </div>
    </section>

    <section id="projects" class="section reveal">
      <div class="card">
        <h2>Projects</h2>
        <p>Project details here.</p>
      </div>
    </section>

    <section id="homelab" class="section reveal">
      <div class="card">
        <h2>Homelab</h2>
        <div id="networkDiagram"></div>
      </div>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
