<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Blackwood Portfolio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="dark">

<canvas id="particles"></canvas>

<header>
  <h1 id="name">Ryan Blackwood</h1>
  <h2 id="subtitle"></h2>
  <nav>
    <div class="tab" data-target="about">About</div>
    <div class="tab" data-target="education">Education</div>
    <div class="tab" data-target="work">Work</div>
    <div class="tab" data-target="skills">Skills</div>
    <div class="tab" data-target="projects">Projects</div>
    <div class="tab" data-target="homelab">Homelab</div>
  </nav>
</header>

<!-- Sticky toggle buttons -->
<div id="controls">
  <button id="terminalToggle">💻</button>
  <button id="themeToggle">🌙</button>
</div>

<main>
  <section id="about" class="card glass">About me content...</section>
  <section id="education" class="card glass">Education content...</section>
  <section id="work" class="card glass">Work history...</section>
  <section id="skills" class="card glass">Skills content...</section>
  <section id="projects" class="card glass">Projects content...</section>

  <section id="homelab" class="card glass">
    <div id="networkWrapper">
      <canvas id="networkCanvas"></canvas>
      <div id="networkNodes"></div>
    </div>
  </section>
</main>

<!-- Terminal pinned to footer -->
<div id="terminal">
  <div id="terminalOutput"></div>
  <input type="text" id="terminalInput" placeholder="Enter command...">
</div>

<script src="scripts.js"></script>
</body>
</html>
