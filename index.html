<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ryan Blackwood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-btn">🌙</button>

    <!-- Landing -->
    <h1 class="title fade-in">Ryan Blackwood</h1>

    <!-- Tabs -->
    <div class="tabs fade-in delay-1">
      <button class="tab active" data-tab="about">About</button>
      <button class="tab" data-tab="education">Education</button>
      <button class="tab" data-tab="work">Work</button>
      <button class="tab" data-tab="projects">Projects</button>
      <button class="tab" data-tab="homelab">Homelab</button>
    </div>

    <!-- Content -->
    <div class="content fade-in delay-2">

      <div class="tab-content active" id="about">
        <p>About me content goes here.</p>
      </div>

      <div class="tab-content" id="education">
        <p>Education details go here.</p>
      </div>

      <div class="tab-content" id="work">
        <p>Work history goes here.</p>
      </div>

      <div class="tab-content" id="projects">
        <p>Projects go here.</p>
      </div>

      <div class="tab-content" id="homelab">
        <p>Interactive homelab visualization coming soon.</p>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
